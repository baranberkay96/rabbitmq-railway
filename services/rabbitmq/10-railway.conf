## RabbitMQ on Railway: static settings.
## Replaces the image's 10-defaults.conf. Values that depend on the service variables
## (credentials, memory, disk) are written to 90-railway-runtime.conf at start-up.
## Reference: https://www.rabbitmq.com/docs/configure

## The image's defaults let `guest` log in from any address. Restore RabbitMQ's own
## rule: `guest` may only connect from localhost. The template never creates `guest`
## anyway (the default user comes from RABBITMQ_DEFAULT_USER).
loopback_users.guest = true

## Logs go to stdout for Railway's log viewer, not to files in the container.
log.console = true
log.file = false

## AMQP 0-9-1 and AMQP 1.0 on 5672 for the private network. A bare port makes RabbitMQ
## listen on IPv6 and IPv4 (dual-stack).
listeners.tcp.default = 5672

## Management UI and HTTP API (the public domain's target port). "::" is dual-stack on Linux.
management.tcp.port = 15672
management.tcp.ip = ::
management.hsts.policy = max-age=31536000
management.headers.content_type_options = nosniff
management.headers.frame_options = DENY

## Prometheus metrics (private network only, no public domain).
prometheus.tcp.port = 15692
prometheus.tcp.ip = ::
